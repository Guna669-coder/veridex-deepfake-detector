<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VERIDEX — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/auth.css">
<script src="js/api.js"></script>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>

<nav class="topbar">
  <a href="index.html" class="nav-logo">VERIDEX</a>
  <div class="nav-right">
    <button class="theme-btn" id="themeBtn">🌙</button>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-eyebrow">ACCOUNT RECOVERY</div>
    <div class="auth-title">FORGOT PASSWORD</div>

    <div class="form-error" id="formError"></div>
    <div class="form-success" id="formSuccess"></div>

    <form class="auth-form" id="forgotForm">
      <div class="form-group">
        <label class="form-label">EMAIL</label>
        <input class="form-input" type="email" id="fpEmail" placeholder="you@example.com" required>
      </div>
      <button class="form-submit" id="fpBtn" type="submit">SEND RESET LINK →</button>
      <div class="auth-links">
        <a href="auth.html">← BACK TO LOGIN</a>
        <span></span>
      </div>
    </form>
  </div>
</div>

<script src="js/theme.js"></script>
<script>
  const form  = document.getElementById('forgotForm');
  const errEl = document.getElementById('formError');
  const okEl  = document.getElementById('formSuccess');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('on'); okEl.classList.remove('on');
    const btn = document.getElementById('fpBtn');
    btn.disabled = true; btn.textContent = 'SENDING...';
    try {
      const res = await API.auth.forgotPassword(document.getElementById('fpEmail').value.trim());
      okEl.textContent = res.message || 'If that email exists, a reset link was sent.';
      okEl.classList.add('on');
      form.reset();
    } catch (err) {
      errEl.textContent = err.message || 'Something went wrong.';
      errEl.classList.add('on');
    }
    btn.disabled = false; btn.textContent = 'SEND RESET LINK →';
  });
</script>
</body>
</html>
