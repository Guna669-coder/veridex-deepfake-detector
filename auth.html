<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VERIDEX — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/auth.css">
<script src="js/api.js"></script>
<script>
  // Already logged in? Skip straight to where they were headed.
  if (API.auth.isLoggedIn()) {
    const params = new URLSearchParams(location.search);
    window.location.replace(params.get('redirect') || 'engine.html');
  }
</script>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>

<nav class="topbar">
  <a href="index.html" class="nav-logo">VERIDEX</a>
  <div class="nav-right">
    <button class="theme-btn" id="themeBtn">🌙</button>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-eyebrow">NEURAL FORENSIC ENGINE</div>
    <div class="auth-title">ACCOUNT ACCESS</div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" type="button">LOGIN</button>
      <button class="auth-tab" id="tabRegister" type="button">REGISTER</button>
    </div>

    <div class="form-error" id="formError"></div>
    <div class="form-success" id="formSuccess"></div>

    <!-- LOGIN -->
    <form class="auth-form" id="loginForm">
      <div class="form-group">
        <label class="form-label">EMAIL</label>
        <input class="form-input" type="email" id="loginEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">PASSWORD</label>
        <input class="form-input" type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button class="form-submit" id="loginBtn" type="submit">SIGN IN →</button>
      <div class="auth-links">
        <a href="forgot-password.html">FORGOT PASSWORD?</a>
        <span></span>
      </div>
    </form>

    <!-- REGISTER -->
    <form class="auth-form hidden" id="registerForm">
      <div class="form-group">
        <label class="form-label">NAME</label>
        <input class="form-input" type="text" id="regName" placeholder="Your name" minlength="2" maxlength="50" required>
      </div>
      <div class="form-group">
        <label class="form-label">EMAIL</label>
        <input class="form-input" type="email" id="regEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">PASSWORD</label>
        <input class="form-input" type="password" id="regPassword" placeholder="At least 6 characters" minlength="6" required>
      </div>
      <button class="form-submit" id="registerBtn" type="submit">CREATE ACCOUNT →</button>
    </form>

    <div class="auth-note">
      YOUR SCANS, FEEDBACK &amp; LEARNED SIGNAL WEIGHTS ARE TIED TO YOUR ACCOUNT.<br>
      IMAGE ANALYSIS STILL RUNS ENTIRELY IN YOUR BROWSER.
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/theme.js"></script>
<script src="js/auth-page.js"></script>
</body>
</html>
