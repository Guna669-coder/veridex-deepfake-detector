<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VERIDEX — Set New Password</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/auth.css">
<script src="js/api.js"></script>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>

<nav class="topbar">
  <a href="index.html" class="nav-logo">VERIDEX</a>
  <div class="nav-right">
    <button class="theme-btn" id="themeBtn">🌙</button>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-eyebrow">ACCOUNT RECOVERY</div>
    <div class="auth-title">NEW PASSWORD</div>

    <div class="form-error" id="formError"></div>
    <div class="form-success" id="formSuccess"></div>

    <form class="auth-form" id="resetForm">
      <div class="form-group">
        <label class="form-label">NEW PASSWORD</label>
        <input class="form-input" type="password" id="rpPassword" placeholder="At least 6 characters" minlength="6" required>
      </div>
      <div class="form-group">
        <label class="form-label">CONFIRM PASSWORD</label>
        <input class="form-input" type="password" id="rpConfirm" placeholder="Repeat password" minlength="6" required>
      </div>
      <button class="form-submit" id="rpBtn" type="submit">RESET PASSWORD →</button>
    </form>
  </div>
</div>

<script src="js/theme.js"></script>
<script>
  const token = new URLSearchParams(location.search).get('token');
  const form  = document.getElementById('resetForm');
  const errEl = document.getElementById('formError');
  const okEl  = document.getElementById('formSuccess');

  if (!token) {
    form.style.display = 'none';
    errEl.textContent = 'Missing or invalid reset link. Request a new one.';
    errEl.classList.add('on');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('on'); okEl.classList.remove('on');
    const pw = document.getElementById('rpPassword').value;
    const cf = document.getElementById('rpConfirm').value;
    if (pw !== cf) {
      errEl.textContent = 'Passwords do not match.';
      errEl.classList.add('on');
      return;
    }
    const btn = document.getElementById('rpBtn');
    btn.disabled = true; btn.textContent = 'RESETTING...';
    try {
      const res = await API.auth.resetPassword(token, pw);
      okEl.textContent = (res.message || 'Password reset successfully') + ' — redirecting to login...';
      okEl.classList.add('on');
      setTimeout(() => window.location.href = 'auth.html', 1200);
    } catch (err) {
      errEl.textContent = err.message || 'Reset failed. The link may have expired.';
      errEl.classList.add('on');
      btn.disabled = false; btn.textContent = 'RESET PASSWORD →';
    }
  });
</script>
</body>
</html>
